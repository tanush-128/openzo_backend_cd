apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-deployment
  labels:
    app: websocket-deployment

spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: websocket-deployment
  template:
    metadata:
      labels:
        app: websocket-deployment
    spec:
      containers:
        - name: websocket-container
          image: tanush128/websocket:0.0.1-08709c3
          volumeMounts:
            - name: config-volume
              mountPath: /go/src/app/config/config.yaml
              subPath: config.yaml
            - name: common-config-volume
              mountPath: /go/src/app/config/common-config.yaml
              subPath: common-config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: websocket-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: websocket-service

spec:
  selector:
    app: websocket-deployment
  ports:
    - targetPort: 8080
      port: 8080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-config
data:
  config.yaml: |
    DB_URL: "admin:fNsZCbxEMrDNMlPTRthx@tcp(openzo.cro8kayema45.ap-south-1.rds.amazonaws.com)/openzo?charset=utf8&parseTime=True&loc=Local"
    DB_NAME: "websocket_service_db"
    GRPC_PORT: "50051"
    HTTP_PORT: "8080"
    MODE: "production"
