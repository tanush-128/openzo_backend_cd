apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-deployment
  labels:
    app: image-deployment

spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: image-deployment
  template:
    metadata:
      labels:
        app: image-deployment
    spec:
      containers:
      - name: image-container
        image: tanush128/image:0.0.1-e2e3d58
        volumeMounts:
            - name: config-volume
              mountPath: /go/src/app/config/config.yaml
              subPath: config.yaml   
            - name: common-config-volume
              mountPath: /go/src/app/config/common-config.yaml
              subPath: common-config.yaml   
      volumes:
        - name: config-volume
          configMap:
            name: image-config
            items:
              - key: config.yaml
                path: config.yaml  
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml

---

apiVersion: v1
kind: Service
metadata:
  name: image-service

spec:
  selector:
    app: image-deployment
  ports:
    - targetPort: 50051
      port: 50051  

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: image-config
data:
  config.yaml: |
    DB_URL: "admin:WRXqYoTG9aLP4CL6gtoF@tcp(database-2.cro8kayema45.ap-south-1.rds.amazonaws.com)/openzo?charset=utf8&parseTime=True&loc=Local"
    DB_NAME: "image_service_db"
    GRPC_PORT: "50051"
    MODE: "dev"


