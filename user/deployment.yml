apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  labels:
    app: user-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-deployment
  template:
    metadata:
      labels:
        app: user-deployment
    spec:
      containers:
      - name: user-container
        image: tanush128/user:0.0.1-2bf8928
        imagePullPolicy: Always
        ports:
         - containerPort: 8080
        livenessProbe:
         httpGet:
            path: /ping
            port: 8080
         initialDelaySeconds: 15
         periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10