apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  labels:
    app: user-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-deployment
  template:
    metadata:
      labels:
        app: user-deployment
    spec:
      containers:
      - name: user-container
        image: tanush128/user:0.0.1-2bf8928
        ports:
         - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "0.5"
            memory: "256Mi"
        volumeMounts:
            - name: config-volume
              mountPath: /app/config
              subPath: config.yaml    
      volumes:
        - name: config-volume
          configMap:
            name: my-config
            items:
              - key: config.yaml
                path: config.yaml  