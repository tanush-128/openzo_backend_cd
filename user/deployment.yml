apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  labels:
    app: user-deployment

spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: user-deployment
  template:
    metadata:
      labels:
        app: user-deployment
    spec:
      containers:
      - name: user-container
        image: tanush128/user:0.0.1-d1b79c2
        volumeMounts:
            - name: config-volume
              mountPath: /go/src/app/config/config.yaml
              subPath: config.yaml   
            - name: common-config-volume
              mountPath: /go/src/app/config/common-config.yaml
              subPath: common-config.yaml
            - name: kafka-config-volume
              mountPath: /go/src/app/client.properties
              subPath: client.properties                               
      volumes:
        - name: config-volume
          configMap:
            name: user-config
            items:
              - key: config.yaml
                path: config.yaml  
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml
        - name: kafka-config-volume
          configMap:
            name: kafka-config
            items:
              - key: client.properties
                path: client.properties
---

apiVersion: v1
kind: Service
metadata:
  name: user-service

spec:
  selector:
    app: user-deployment
  ports:
    - name: http 
      targetPort: 8080
      port: 8080
    - name: grpc 
      targetPort: 50051
      port: 50051

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: user-config
data:
  config.yaml: |
    DB_URL: "admin:fNsZCbxEMrDNMlPTRthx@tcp(openzo.cro8kayema45.ap-south-1.rds.amazonaws.com)/openzo?charset=utf8&parseTime=True&loc=Local"
    DB_NAME: "user_service_db"
    HTTP_PORT: "8080"
    GRPC_PORT: "50051"
    MODE: "production"


