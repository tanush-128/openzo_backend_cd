apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  labels:
    app: user-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-deployment
  template:
    metadata:
      labels:
        app: user-deployment
    spec:
      containers:
      - name: user-container
        image: tanush128/user:0.0.1-e8fa96a
        ports:
         - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "0.5"
            memory: "256Mi"
        volumeMounts:
            - name: config-volume
              mountPath: /go/src/app/config/config.yaml
              subPath: config.yaml   
            - name: common-config-volume
              mountPath: /go/src/app/config/common-config.yaml
              subPath: common-config.yaml   
      volumes:
        - name: config-volume
          configMap:
            name: my-config
            items:
              - key: config.yaml
                path: config.yaml  
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml