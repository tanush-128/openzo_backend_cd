apiVersion: apps/v1
kind: Deployment
metadata:
  name: store_customer-deployment
  labels:
    app: store_customer-deployment

spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: store_customer-deployment
  template:
    metadata:
      labels:
        app: store_customer-deployment
    spec:
      containers:
      - name: store_customer-container
        image: tanush128/store_customer:0.0.1-68560a7
        volumeMounts:
            - name: config-volume
              mountPath: /go/src/app/config/config.yaml
              subPath: config.yaml   
            - name: common-config-volume
              mountPath: /go/src/app/config/common-config.yaml
              subPath: common-config.yaml
            - name: kafka-config-volume
              mountPath: /go/src/app/client.properties
              subPath: client.properties                               
      volumes:
        - name: config-volume
          configMap:
            name: store_customer-config
            items:
              - key: config.yaml
                path: config.yaml  
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml
        - name: kafka-config-volume
          configMap:
            name: kafka-config
            items:
              - key: client.properties
                path: client.properties
---

apiVersion: v1
kind: Service
metadata:
  name: store_customer-service

spec:
  selector:
    app: store_customer-deployment
  ports:
    - targetPort: 8080
      port: 8080
    

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: store_customer-config
data:
  config.yaml: |
    DB_URL: "admin:fNsZCbxEMrDNMlPTRthx@tcp(openzo.cro8kayema45.ap-south-1.rds.amazonaws.com)/openzo?charset=utf8&parseTime=True&loc=Local"
    DB_NAME: "store_customer_service_db"
    HTTP_PORT: "8080"
    MODE: "production"


