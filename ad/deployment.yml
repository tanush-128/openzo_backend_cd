apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad-deployment
  labels:
    app: ad-deployment

spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ad-deployment
  template:
    metadata:
      labels:
        app: ad-deployment
    spec:
      containers:
      - name: ad-container
        image: tanush128/ad:0.0.1-239bc5a
        volumeMounts:
            - name: config-volume
              mountPath: /go/src/app/config/config.yaml
              subPath: config.yaml   
            - name: common-config-volume
              mountPath: /go/src/app/config/common-config.yaml
              subPath: common-config.yaml   
      volumes:
        - name: config-volume
          configMap:
            name: ad-config
            items:
              - key: config.yaml
                path: config.yaml  
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml

---

apiVersion: v1
kind: Service
metadata:
  name: ad-service

spec:
  selector:
    app: ad-deployment
  ports:
    - targetPort: 8080
      port: 8080


---

apiVersion: v1
kind: ConfigMap
metadata:
  name: ad-config
data:
  config.yaml: |
    DB_URL: "admin:fNsZCbxEMrDNMlPTRthx@tcp(openzo.cro8kayema45.ap-south-1.rds.amazonaws.com)/openzo?charset=utf8&parseTime=True&loc=Local"
    DB_NAME: "ad_service_db"
    HTTP_PORT: "8080"
    GRPC_PORT: "50051"
    MODE: "production"


