apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-deployment
  labels:
    app: store-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-deployment
  template:
    metadata:
      labels:
        app: store-deployment
    spec:
      containers:
      - name: store-container
        image: tanush128/store:0.0.1-add4fe9
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "0.5"
            memory: "256Mi"
        volumeMounts:
            - name: config-volume
              mountPath: /go/src/app/config/config.yaml
              subPath: config.yaml   
            - name: common-config-volume
              mountPath: /go/src/app/config/common-config.yaml
              subPath: common-config.yaml   
      volumes:
        - name: config-volume
          configMap:
            name: store-config
            items:
              - key: config.yaml
                path: config.yaml  
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml       


---

apiVersion: v1
kind: ConfigMap
metadata:
  name: store-config
data:
  config.yaml: |
    DB_URL: "admin:WRXqYoTG9aLP4CL6gtoF@tcp(database-2.cro8kayema45.ap-south-1.rds.amazonaws.com)/openzo?charset=utf8&parseTime=True&loc=Local"
    DB_NAME: "user_service_db"
