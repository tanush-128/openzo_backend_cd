apiVersion: apps/v1
kind: Deployment
metadata:
  name: enquiry-deployment
  labels:
    app: enquiry-deployment

spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: enquiry-deployment
  template:
    metadata:
      labels:
        app: enquiry-deployment
    spec:
      containers:
      - name: enquiry-container
        image: tanush128/enquiry:0.0.1-bbd0add
        volumeMounts:
            - name: config-volume
              mountPath: /go/src/app/config/config.yaml
              subPath: config.yaml   
            - name: common-config-volume
              mountPath: /go/src/app/config/common-config.yaml
              subPath: common-config.yaml   
      volumes:
        - name: config-volume
          configMap:
            name: enquiry-config
            items:
              - key: config.yaml
                path: config.yaml  
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml

---

apiVersion: v1
kind: Service
metadata:
  name: enquiry-service

spec:
  selector:
    app: enquiry-deployment
  ports:
    - targetPort: 8080
      port: 8080


---

apiVersion: v1
kind: ConfigMap
metadata:
  name: enquiry-config
data:
  config.yaml: |
    DB_URL: "admin:WRXqYoTG9aLP4CL6gtoF@tcp(database-2.cro8kayema45.ap-south-1.rds.amazonaws.com)/openzo?charset=utf8&parseTime=True&loc=Local"
    DB_NAME: "enquiry_service_db"
    HTTP_PORT: "8080"
    MODE: "dev"


