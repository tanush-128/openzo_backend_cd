apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  labels:
    app: gateway-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-deployment
  template:
    metadata:
      labels:
        app: gateway-deployment
    spec:
      containers:
      - name: gateway-container
        image: tanush128/gateway:0.0.1-2f23d0a
        imagePullPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service

spec:
  # type: NodePort
  selector:
    app: gateway-deployment
  ports:
    - targetPort: 8000
      port: 8000
     
          