apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
spec:
  rules:
  - host:  # Define your desired hostname here
    http:
      paths:
      - path: /users/*
        pathType: Prefix  # Explicitly set path matching type
        backend:
          service:
            name: user-service
            port:
              number: 8080
      - path: /stores/*
        pathType: Prefix
        backend:
          service:
            name: store-service
            port:
              number: 8080
      - path: /products/*
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8080
      - path: /sales/*
        pathType: Prefix
        backend:
          service:
            name: sale-service
            port:
              number: 8080
      - path: /online_orders/*
        pathType: Prefix
        backend:
          service:
            name: onlineorder-service
            port:
              number: 8080
      - path: /enquiry/*
        pathType: Prefix
        backend:
          service:
            name: enquiry-service
            port:
              number: 8080
  # Add additional paths for other microservices here
