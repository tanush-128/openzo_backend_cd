apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-deployment
  labels:
    app: search-deployment

spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: search-deployment
  template:
    metadata:
      labels:
        app: search-deployment
    spec:
      containers:
        - name: search-container
          image: tanush128/search:0.0.1-640be26
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/config.yaml
              subPath: config.yaml
            - name: common-config-volume
              mountPath: /app/config/common-config.yaml
              subPath: common-config.yaml
            - name: kafka-config-volume
              mountPath: /app/client.properties
              subPath: client.properties
      volumes:
        - name: config-volume
          configMap:
            name: search-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: common-config-volume
          configMap:
            name: common-config
            items:
              - key: common-config.yaml
                path: common-config.yaml
        - name: kafka-config-volume
          configMap:
            name: kafka-config
            items:
              - key: client.properties
                path: client.properties

---
apiVersion: v1
kind: Service
metadata:
  name: search-service

spec:
  selector:
    app: search-deployment
  ports:
    - name: http
      targetPort: 8080
      port: 8080

