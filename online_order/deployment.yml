apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlineorder-deployment
  labels:
    app: onlineorder-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: onlineorder-deployment
  template:
    metadata:
      labels:
        app: onlineorder-deployment
    spec:
      containers:
      - name: onlineorder-container
        image: tanush128/online_order:0.0.1-b11687c
       